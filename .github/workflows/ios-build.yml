# Builds an unsigned iOS app (LifeRPG.ipa) on a GitHub-hosted Mac.
# The .ipa is signed and installed later with Sideloadly (Windows) using
# your own Apple ID — no Mac needed.
#
# Optional repository secrets SUPABASE_URL and SUPABASE_ANON_KEY enable
# accounts and sync; without them the app runs in offline guest mode.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.2
          channel: stable
          cache: true

      - name: Write env.json from secrets (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > env.json
          else
            echo '{}' > env.json
          fi

      - run: flutter pub get

      - name: Tests
        run: flutter test

      # Release mode: iOS does not allow debug (JIT) builds to start without
      # an attached debugger.
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --dart-define-from-file=env.json

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LifeRPG.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LifeRPG-ios
          path: LifeRPG.ipa
          retention-days: 14
