name: life_rpg
description: "Life RPG — real life progression system."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  collection: ^1.19.0
  connectivity_plus: ^7.3.1
  file_picker: ^11.0.3
  fl_chart: ^0.71.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.4
  flutter_timezone: ^4.1.1
  go_router: ^16.1.0
  google_fonts: ^6.3.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.3.4
  intl: 0.19.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  supabase_flutter: ^2.15.4
  timezone: ^0.10.1
  uuid: ^4.6.0
  web: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled fonts (SIL OFL 1.1). google_fonts picks them up by file name,
  # so typography works offline from the very first launch.
  assets:
    - assets/fonts/
