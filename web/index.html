<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Replaced by the value of `--base-href` at build time. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Life RPG — прокачивай персонажа, прокачивай себя в реальной жизни.">
  <meta name="theme-color" content="#0E0E0F">

  <!-- iOS: installs from Safari via Share → Add to Home Screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Opaque status bar. "black-translucent" makes iOS draw the app under the
       status bar while Flutter maps touches from the old origin, so taps land
       below the finger. Flutter also replaces any viewport meta at startup. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Life RPG">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Life RPG</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0E0E0F; overscroll-behavior: none; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: #C9C6BF; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .01em;
    }
    #loader svg { width: 132px; height: 132px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) { #loader svg { animation: none; } }
  </style>
</head>
<body>
  <div id="loader">
    <!-- Same geometry as BrandMark in lib/core/widgets/brand_mark.dart. -->
    <svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#C2A26B" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M22 49 L50 25 L78 49"/>
      <path d="M22 75 L50 51 L78 75"/>
    </svg>
    <div>Загрузка мира…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
